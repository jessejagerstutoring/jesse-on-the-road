<figure style="margin: 0; position: relative; border: 2px solid #000; aspect-ratio: 16 / 8; max-width: 100%; overflow: hidden; background: #fff;">
<img src="assets/tram.svg" alt="Tekening van tram 28 in een smalle straat met was aan de lijn" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
<figcaption style="position: absolute; left: 0; bottom: 0; background: #000; color: #fff; padding: 10px 22px 14px; display: flex; flex-direction: column;">
<span>Groeten uit</span>
<span style="font-family: 'Bricolage Grotesque', Arial, sans-serif; font-weight: 800; font-size: clamp(40px, 8vw, 88px); line-height: .95; letter-spacing: -.02em;">Lissabon</span>
</figcaption>

<section aria-label="Achterkant van de kaart" style="border: 2px solid #000; display: flex; flex-wrap: wrap; box-shadow: 8px 8px 0 #000; background: #fff;">
<article style="flex: 999 1 520px; min-width: 0; padding: clamp(20px, 3vw, 36px); display: flex; flex-direction: column; gap: 20px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Arial, sans-serif; font-weight: 800; font-size: clamp(32px, 4.4vw, 50px); line-height: 1.02; letter-spacing: -.02em; text-wrap: balance;">De tram die bijna de muur raakte</h1>
<p style="margin: 0;">Lieve allemaal,</p>
<p style="margin: 0;">Om half acht stond ik al bij de halte op Praça Martim Moniz, want iedereen had gezegd: later is het vol. Tram 28 kwam piepend de hoek om, geel en veel kleiner dan ik dacht.</p>
<p style="margin: 0;">De bestuurder knikte, ik ging achterin zitten en we klommen de Alfama in. De straatjes zijn daar zo smal dat je de was van iemands balkon kunt aanraken. Bij elke bocht dacht ik: nu gaat het mis.</p>
<p style="margin: 0;">Een mevrouw met een tas sinaasappels stapte in, zag mijn gezicht en lachte. &lsquo;Todos os dias,&rsquo; zei ze. Elke dag.</p>
<p style="margin: 0;">Bij de Miradouro da Graça ben ik uitgestapt. Beneden lag de stad met al haar daken, en ergens daartussen piepte tram 28 alweer de volgende bocht om.</p>
<p style="margin: 0;">Liefs, Jesse</p>
</article>
<aside style="flex: 1 1 260px; min-width: 0; border-left: 2px solid #000; padding: clamp(20px, 3vw, 32px); display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
<div aria-hidden="true" style="width: 112px; height: 112px; border: 3px double #000; border-radius: 50%; transform: rotate(-12deg); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; line-height: 1.15; text-align: center;">LISSABON<br>38.72 N<br>9.14 W</div>
<div aria-hidden="true" style="width: 84px; height: 104px; border: 3px dashed #000; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', Arial, sans-serif; font-weight: 800; font-size: 44px;">2</div>
</div>
<div style="position: relative;">
<img src="assets/world-dots.svg" alt="Wereldkaart met Lissabon gemarkeerd" style="display: block; width: 100%; height: auto;">
<span style="position: absolute; left: 47.46%; top: 29.49%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #000; border: 3px solid #fff;"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', Arial, sans-serif; font-weight: 800; font-size: 28px;">P.S. Zelf doen?</h2>
<p style="margin: 0; font-size: 19px;">Stap in bij Martim Moniz, vóór negen uur.</p>
<p style="margin: 0; font-size: 19px;">Hou je tas voor je. Zakkenrollers rijden graag mee op deze lijn.</p>
<p style="margin: 0; font-size: 19px;">Koop een dagkaart. Een los kaartje bij de bestuurder is duurder.</p>
</div>
