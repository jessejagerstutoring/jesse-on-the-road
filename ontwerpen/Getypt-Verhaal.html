<p style="margin: 0;">Lissabon, Portugal &middot; 38.72 N, 9.14 W &middot; 4 minuten lezen</p>
<h1 style="margin: 0; font-family: 'Archivo', Arial, sans-serif; font-stretch: 125%; font-weight: 900; font-size: clamp(40px, 7.4vw, 92px); line-height: .98; letter-spacing: -.025em; text-wrap: balance;">De tram die bijna de muur raakte</h1>

<article style="flex: 999 1 560px; min-width: 0; max-width: 680px; display: flex; flex-direction: column; gap: 24px;">
<p style="margin: 0;">Om half acht stond ik al bij de halte op Praça Martim Moniz, want iedereen had gezegd: later is het vol. Tram 28 kwam piepend de hoek om, geel en <s>groter</s> veel kleiner dan ik dacht.</p>
<p style="margin: 0;">De bestuurder knikte, ik ging achterin zitten en we klommen de Alfama in. De straatjes zijn daar zo smal dat je de was van iemands balkon kunt aanraken. Bij elke bocht dacht ik: nu gaat het mis.</p>
<figure style="margin: 8px 0; transform: rotate(-1.2deg); background: #fff; border: 1px solid #000; padding: 14px 14px 10px;">
<img src="assets/tram.svg" alt="Tekening van tram 28 in een smalle straat met was aan de lijn" style="display: block; width: 100%; height: auto;">
<figcaption style="padding-top: 10px; font-size: 18px;">Foto 1. Hier past nog net een tram tussen. Ik heb het nagemeten met mijn elleboog.</figcaption>
</figure>
<p style="margin: 0;">Een mevrouw met een tas sinaasappels stapte in, zag mijn gezicht en lachte. &lsquo;Todos os dias,&rsquo; zei ze. Elke dag.</p>
<p style="margin: 0;">Bij de Miradouro da Graça ben ik uitgestapt. Beneden lag de stad met al haar daken, en ergens daartussen piepte tram 28 alweer de volgende bocht om.</p>
</article>
