<span>REYKJAVIK</span>
<span aria-label="naar">&rarr;</span>
<span>LISSABON</span>

<h1 style="margin: 0; font-family: 'Courier Prime', 'Courier New', monospace; font-weight: 700; font-size: clamp(28px, 3.6vw, 42px); line-height: 1.15; text-wrap: balance;">De tram die bijna de muur raakte</h1>
</div>

<div style="display: flex; flex-direction: column;"><span style="font-size: 16px;">Stop</span><strong>2 van 6</strong></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 16px;">Leestijd</span><strong>4 minuten</strong></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 16px;">Waar precies</span><strong>38.72 N, 9.14 W</strong></div>

<div style="background: #fff; color: #000; padding-inline: max(16px, 4vw); padding-block: 48px;">
<div style="max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start;">
<article style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<p style="margin: 0;">Om half acht stond ik al bij de halte op Praça Martim Moniz, want iedereen had gezegd: later is het vol. Tram 28 kwam piepend de hoek om, geel en veel kleiner dan ik dacht.</p>
<p style="margin: 0;">De bestuurder knikte, ik ging achterin zitten en we klommen de Alfama in. De straatjes zijn daar zo smal dat je de was van iemands balkon kunt aanraken. Bij elke bocht dacht ik: nu gaat het mis.</p>
<img src="assets/tram.svg" alt="Tekening van tram 28 in een smalle straat met was aan de lijn" style="display: block; width: 100%; height: auto; border: 3px solid #000; box-sizing: border-box;">
<p style="margin: 0;">Een mevrouw met een tas sinaasappels stapte in, zag mijn gezicht en lachte. &lsquo;Todos os dias,&rsquo; zei ze. Elke dag.</p>
<p style="margin: 0;">Bij de Miradouro da Graça ben ik uitgestapt. Beneden lag de stad met al haar daken, en ergens daartussen piepte tram 28 alweer de volgende bocht om.</p>
</article>
<aside style="flex: 1 1 280px; min-width: 0; background: #000; color: #fff; padding: 24px; display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 38px; line-height: 1;">GOED OM TE WETEN</h2>
<p style="margin: 0;">Stap in bij Martim Moniz, vóór negen uur.</p>
<p style="margin: 0;">Hou je tas voor je. Zakkenrollers rijden graag mee op deze lijn.</p>
<p style="margin: 0;">Koop een dagkaart. Een los kaartje bij de bestuurder is duurder.</p>
</aside>
